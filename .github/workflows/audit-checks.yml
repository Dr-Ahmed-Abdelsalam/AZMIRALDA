name: Audit checks
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and integration checks
        run: npm run check
